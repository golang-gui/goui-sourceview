<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GOUI SourceView</title>
</head>
<body>
    <!-- Edit source with native text layout and modern controls. -->
    <main class="editor-demo">
        <h1>A code editor for Go</h1>
        <p>Built with GOUI &amp; SourceView.</p>

        <section id="features" aria-label="Editor features">
            <h2>Small API. Real editing.</h2>
            <ul>
                <li>JSON, XML, HTML, TOML, YAML and Shell highlighting</li>
                <li>Find, replace and atomic undo</li>
                <li>Completion and matching brackets</li>
                <li>Modern light and dark appearances</li>
            </ul>
        </section>

        <footer>Native widgets. Go all the way.</footer>
    </main>
</body>
</html>
