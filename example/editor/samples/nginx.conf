worker_processes auto;
events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name example.test;
        root /srv/editor;

        # Forward API requests to the local service.
        location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
